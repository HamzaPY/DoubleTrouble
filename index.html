<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FFD91A">
  <title>Double Trouble — Coming Soon</title>
  <meta name="description" content="Double Trouble is coming soon.">
  <style>
    :root{
      --yellow:#FFD91A;
      --black:#0B0B0B;
      --white:#FFFDF5;
      --muted:#A5A5A5;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--black)}
    body{
      min-height:100vh;
      font-family:Arial,Helvetica,sans-serif;
      color:var(--white);
    }
    .page{
      min-height:100vh;
      display:grid;
      grid-template-columns:minmax(320px,.9fr) minmax(480px,1.1fr);
      overflow:hidden;
    }
    .visual{
      position:relative;
      background:var(--yellow);
      color:var(--black);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:55px;
      overflow:hidden;
    }
    .visual:before{
      content:"";
      position:absolute;
      width:520px;height:520px;
      border:2px solid rgba(0,0,0,.10);
      border-radius:50%;
      left:-280px;top:-250px;
    }
    .visual:after{
      content:"";
      position:absolute;
      width:270px;height:270px;
      border:2px solid rgba(0,0,0,.12);
      border-radius:50%;
      right:-130px;bottom:-100px;
    }
    .brand{
      position:relative;
      z-index:2;
      width:min(430px,90%);
    }
    .mark{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:82px;height:82px;
      border:4px solid var(--black);
      border-radius:18px;
      font-weight:1000;
      font-size:31px;
      letter-spacing:-3px;
      margin-bottom:32px;
    }
    .brand-name{
      margin:0;
      font-size:clamp(54px,6vw,92px);
      line-height:.88;
      letter-spacing:-.07em;
      font-weight:1000;
      text-transform:uppercase;
    }
    .brand-name span{display:block}
    .domain{
      display:inline-block;
      margin-top:34px;
      padding-top:16px;
      border-top:4px solid var(--black);
      font-size:15px;
      font-weight:800;
      letter-spacing:.08em;
    }
    .content{
      position:relative;
      display:flex;
      justify-content:center;
      flex-direction:column;
      padding:clamp(50px,8vw,120px);
    }
    .kicker{
      display:flex;
      align-items:center;
      gap:13px;
      margin-bottom:30px;
      color:var(--yellow);
      font-size:12px;
      font-weight:900;
      letter-spacing:.22em;
      text-transform:uppercase;
    }
    .kicker:before{
      content:"";
      width:42px;height:3px;
      background:var(--yellow);
    }
    h1{
      margin:0;
      max-width:680px;
      font-size:clamp(62px,8vw,116px);
      line-height:.86;
      letter-spacing:-.065em;
      font-weight:1000;
      text-transform:uppercase;
    }
    h1 .soon{
      color:var(--yellow);
      display:block;
    }
    .copy{
      max-width:520px;
      margin:34px 0 0;
      color:var(--muted);
      font-size:18px;
      line-height:1.65;
    }
    .line{
      width:min(520px,100%);
      height:1px;
      background:#292929;
      margin:38px 0 22px;
    }
    .status{
      display:flex;
      align-items:center;
      gap:12px;
      font-size:12px;
      font-weight:900;
      letter-spacing:.15em;
      text-transform:uppercase;
    }
    .dot{
      width:10px;height:10px;
      border-radius:50%;
      background:var(--yellow);
      box-shadow:0 0 0 5px rgba(255,217,26,.12);
    }
    .footer{
      position:absolute;
      bottom:28px;
      right:34px;
      color:#555;
      font-size:11px;
      letter-spacing:.15em;
      text-transform:uppercase;
    }
    @media(max-width:820px){
      .page{grid-template-columns:1fr}
      .visual{min-height:43vh;padding:40px 28px}
      .brand{width:100%}
      .mark{width:64px;height:64px;font-size:25px;margin-bottom:24px}
      .brand-name{font-size:clamp(52px,15vw,76px)}
      .content{min-height:57vh;padding:55px 28px 75px}
      h1{font-size:clamp(58px,18vw,90px)}
      .copy{font-size:16px}
      .footer{right:28px;bottom:22px}
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="visual">
      <div class="brand">
        <div class="mark">DT</div>
        <h2 class="brand-name"><span>Double</span><span>Trouble</span></h2>
        <div class="domain">doubletroublewf11.com</div>
      </div>
    </section>

    <section class="content">
      <div class="kicker">Something exciting is cooking</div>
      <h1>Coming <span class="soon">Soon.</span></h1>
      <p class="copy">
        Double Trouble is getting ready to serve something special.
        Our new website is currently under construction and will be live soon.
      </p>
      <div class="line"></div>
      <div class="status"><span class="dot"></span>Website launching soon</div>
      <div class="footer">Double Trouble / 2026</div>
    </section>
  </main>
</body>
</html>
